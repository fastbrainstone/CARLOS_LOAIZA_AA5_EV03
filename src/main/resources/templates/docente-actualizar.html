<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Actualizar Docente</title>

    <link rel="stylesheet" th:href="@{/css/estilos.css}">

</head>

<body>

    <nav class="navbar">

        <div class="nav-left">

            <div class="logo">
                Pilosos
            </div>

            <ul class="nav-links">

                <li>
                    <a th:href="@{/docentes}">
                        Inicio
                    </a>
                </li>

                <li>
                    <a th:href="@{/docentes/consultar}">
                        Docentes
                    </a>
                </li>

                <li>
                    <a th:href="@{/usuarios}">
                        Usuarios
                    </a>
                </li>

            </ul>

        </div>

    </nav>


    <main class="container">

        <section class="form-section">

            <form class="register-form"
                  th:action="@{/docentes/actualizar}"
                  th:object="${docente}"
                  method="post">

                <h3>Actualizar Docente</h3>


                <!-- ID -->
                <div class="input-group">

                    <i>🆔</i>

                    <input type="number"
                           th:field="*{idDocente}"
                           readonly>

                </div>


                <!-- DEPARTAMENTO -->
                <div class="input-group">

                    <i>🏫</i>

                    <input type="text"
                           th:field="*{departamentoAcademico}"
                           maxlength="50"
                           placeholder="Departamento académico">

                </div>

                <div class="error-message"
                     th:if="${#fields.hasErrors('departamentoAcademico')}"
                     th:errors="*{departamentoAcademico}">
                </div>


                <!-- ASIGNATURA -->
                <div class="input-group">

                    <i>📚</i>

                    <input type="text"
                           th:field="*{asignaturaAcademica}"
                           maxlength="50"
                           placeholder="Asignatura académica">

                </div>

                <div class="error-message"
                     th:if="${#fields.hasErrors('asignaturaAcademica')}"
                     th:errors="*{asignaturaAcademica}">
                </div>


                <!-- USUARIO -->
                <div class="input-group">

                    <i>👤</i>

                    <select th:field="*{usuario}">

                        <option th:each="usuario : ${usuarios}"
                                th:value="${usuario.idUsuario}"
                                th:text="${usuario.nombreUsuario + ' '
                                + usuario.apellidoUsuario
                                + ' - '
                                + usuario.correoUsuario}">
                        </option>

                    </select>

                </div>


                <button type="submit"
                        class="btn-submit">

                    Actualizar Docente

                </button>

                <br><br>

                <a class="btn-secondary"
                   th:href="@{/docentes/consultar}">

                    Cancelar

                </a>

            </form>

        </section>

    </main>


    <footer>

        <div class="footer-links">

            <a th:href="@{/docentes}">
                Inicio
            </a>

            <a th:href="@{/docentes/consultar}">
                Docentes
            </a>

        </div>

    </footer>

</body>

</html>
