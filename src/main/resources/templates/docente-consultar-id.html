<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Consultar Docente</title>

    <link rel="stylesheet" th:href="@{/css/estilos.css}">

</head>

<body>

    <nav class="navbar">

        <div class="nav-left">

            <div class="logo">
                Pilosos
            </div>

            <ul class="nav-links">

                <li>
                    <a th:href="@{/docentes}">
                        Inicio
                    </a>
                </li>

                <li>
                    <a th:href="@{/docentes/consultar}">
                        Docentes
                    </a>
                </li>

                <li>
                    <a th:href="@{/usuarios}">
                        Usuarios
                    </a>
                </li>

            </ul>

        </div>

    </nav>


    <main class="crud-container">

        <h1>Consultar docente por ID</h1>


        <form class="crud-form"
              th:action="@{/docentes/consultar-id/buscar}"
              method="get">

            <div class="form-group">

                <label for="id">
                    ID del docente
                </label>

                <input type="number"
                       id="id"
                       name="id"
                       required>

            </div>


            <button type="submit"
                    class="btn-submit">

                Buscar docente

            </button>

        </form>


        <!-- MENSAJE -->
        <div class="message"
             th:if="${mensaje}">

            <span th:text="${mensaje}"></span>

        </div>


        <!-- RESULTADO -->
        <div class="info-card"
             th:if="${docente}">

            <h2>Información del docente</h2>

            <p>

                <strong>ID:</strong>

                <span th:text="${docente.idDocente}">
                </span>

            </p>

            <p>

                <strong>Nombre:</strong>

                <span th:text="${docente.usuario.nombreUsuario}">
                </span>

            </p>

            <p>

                <strong>Apellido:</strong>

                <span th:text="${docente.usuario.apellidoUsuario}">
                </span>

            </p>

            <p>

                <strong>Correo:</strong>

                <span th:text="${docente.usuario.correoUsuario}">
                </span>

            </p>

            <p>

                <strong>Departamento:</strong>

                <span th:text="${docente.departamentoAcademico}">
                </span>

            </p>

            <p>

                <strong>Asignatura:</strong>

                <span th:text="${docente.asignaturaAcademica}">
                </span>

            </p>

        </div>

    </main>


    <footer>

        <div class="footer-links">

            <a th:href="@{/docentes}">
                Inicio
            </a>

            <a th:href="@{/docentes/consultar}">
                Docentes
            </a>

        </div>

    </footer>

</body>

</html>
