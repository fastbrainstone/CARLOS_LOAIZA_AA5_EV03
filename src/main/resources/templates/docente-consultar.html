<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Consultar Docentes</title>

    <link rel="stylesheet" th:href="@{/css/estilos.css}">

</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">

        <div class="nav-left">

            <div class="logo">
                Pilosos
            </div>

            <ul class="nav-links">

                <li>
                    <a th:href="@{/docentes}">
                        Inicio
                    </a>
                </li>

                <li class="dropdown">

                    <a href="#">
                        Docentes
                    </a>

                    <div class="dropdown-content">

                        <a th:href="@{/docentes/registrar}">
                            Registrar
                        </a>

                        <a th:href="@{/docentes/consultar}">
                            Consultar
                        </a>

                        <a th:href="@{/docentes/consultar-id}">
                            Consultar por ID
                        </a>

                        <a th:href="@{/docentes/eliminar}">
                            Eliminar
                        </a>

                    </div>

                </li>

                <li>
                    <a th:href="@{/usuarios}">
                        Usuarios
                    </a>
                </li>

            </ul>

        </div>

    </nav>


    <!-- CONTENIDO -->
    <main class="crud-container">

        <h1>Docentes registrados</h1>

        <a class="btn-primary"
           th:href="@{/docentes/registrar}">

            + Registrar docente

        </a>

        <br><br>


        <div class="table-container">

            <table class="crud-table">

                <thead>

                    <tr>

                        <th>ID Docente</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Correo</th>
                        <th>Departamento</th>
                        <th>Asignatura</th>
                        <th>Acciones</th>

                    </tr>

                </thead>


                <tbody>

                    <tr th:each="docente : ${docentes}">

                        <td th:text="${docente.idDocente}">
                            ID
                        </td>

                        <td th:text="${docente.usuario.nombreUsuario}">
                            Nombre
                        </td>

                        <td th:text="${docente.usuario.apellidoUsuario}">
                            Apellido
                        </td>

                        <td th:text="${docente.usuario.correoUsuario}">
                            Correo
                        </td>

                        <td th:text="${docente.departamentoAcademico}">
                            Departamento
                        </td>

                        <td th:text="${docente.asignaturaAcademica}">
                            Asignatura
                        </td>

                        <td>

                            <div class="action-buttons">

                                <a class="btn-edit"
                                   th:href="@{/docentes/editar/{id}(id=${docente.idDocente})}">

                                    Editar

                                </a>

                                <a class="btn-delete"
                                   th:href="@{/docentes/eliminar}">

                                    Eliminar

                                </a>

                            </div>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </main>


    <!-- FOOTER -->
    <footer>

        <div class="footer-links">

            <a th:href="@{/docentes}">
                Inicio
            </a>

            <a th:href="@{/docentes/registrar}">
                Registrar
            </a>

            <a th:href="@{/usuarios}">
                Usuarios
            </a>

        </div>

    </footer>

</body>

</html>
