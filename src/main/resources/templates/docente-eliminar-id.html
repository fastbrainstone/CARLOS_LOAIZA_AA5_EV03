<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eliminar Docente</title>

    <link rel="stylesheet" th:href="@{/css/estilos.css}">

</head>

<body>

    <nav class="navbar">

        <div class="nav-left">

            <div class="logo">
                Pilosos
            </div>

            <ul class="nav-links">

                <li>
                    <a th:href="@{/docentes}">
                        Inicio
                    </a>
                </li>

                <li>
                    <a th:href="@{/docentes/consultar}">
                        Docentes
                    </a>
                </li>

            </ul>

        </div>

    </nav>


    <main class="container">

        <section class="form-section">

            <form class="register-form"
                  th:action="@{/docentes/eliminar/buscar}"
                  method="post">

                <h3>Eliminar Docente</h3>


                <div class="input-group">

                    <i>🆔</i>

                    <input type="number"
                           name="idDocente"
                           placeholder="ID del docente"
                           required>

                </div>


                <button type="submit"
                        class="btn-submit">

                    Buscar Docente

                </button>

            </form>


            <div class="message"
                 th:if="${mensaje}">

                <span th:text="${mensaje}"></span>

            </div>

        </section>

    </main>


    <footer>

        <div class="footer-links">

            <a th:href="@{/docentes}">
                Inicio
            </a>

            <a th:href="@{/docentes/consultar}">
                Docentes
            </a>

        </div>

    </footer>

</body>

</html>
