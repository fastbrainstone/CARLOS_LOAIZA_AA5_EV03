<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrar Docente</title>

    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">

        <div class="nav-left">

            <div class="logo">
                Pilosos
            </div>

            <ul class="nav-links">

                <li>
                    <a th:href="@{/docentes}">
                        Inicio
                    </a>
                </li>

                <li class="dropdown">

                    <a href="#">
                        Docentes
                    </a>

                    <div class="dropdown-content">

                        <a th:href="@{/docentes/registrar}">
                            Registrar
                        </a>

                        <a th:href="@{/docentes/consultar}">
                            Consultar
                        </a>

                        <a th:href="@{/docentes/consultar-id}">
                            Consultar por ID
                        </a>

                        <a th:href="@{/docentes/eliminar}">
                            Eliminar
                        </a>

                    </div>

                </li>

                <li>
                    <a th:href="@{/usuarios}">
                        Usuarios
                    </a>
                </li>

            </ul>

        </div>

    </nav>


    <!-- CONTENIDO -->
    <main class="container">

        <section class="form-section">

            <form class="register-form"
                  th:action="@{/docentes/guardar}"
                  th:object="${docente}"
                  method="post">

                <h3>Registrar Docente</h3>


                <!-- ID DOCENTE -->
                <div class="input-group">

                    <i>🆔</i>

                    <input type="number"
                           th:field="*{idDocente}"
                           placeholder="ID del docente"
                           required>

                </div>

                <div class="error-message"
                     th:if="${#fields.hasErrors('idDocente')}"
                     th:errors="*{idDocente}">
                </div>


                <!-- DEPARTAMENTO -->
                <div class="input-group">

                    <i>🏫</i>

                    <input type="text"
                           th:field="*{departamentoAcademico}"
                           placeholder="Departamento académico"
                           maxlength="50"
                           required>

                </div>

                <div class="error-message"
                     th:if="${#fields.hasErrors('departamentoAcademico')}"
                     th:errors="*{departamentoAcademico}">
                </div>


                <!-- ASIGNATURA -->
                <div class="input-group">

                    <i>📚</i>

                    <input type="text"
                           th:field="*{asignaturaAcademica}"
                           placeholder="Asignatura académica"
                           maxlength="50"
                           required>

                </div>

                <div class="error-message"
                     th:if="${#fields.hasErrors('asignaturaAcademica')}"
                     th:errors="*{asignaturaAcademica}">
                </div>


                <!-- USUARIO -->
                <div class="input-group">

                    <i>👤</i>

                    <select th:field="*{usuario}"
                            required>

                        <option value="">
                            Seleccione un usuario
                        </option>

                        <option th:each="usuario : ${usuarios}"
                                th:value="${usuario.idUsuario}"
                                th:text="${usuario.nombreUsuario + ' '
                                + usuario.apellidoUsuario
                                + ' - '
                                + usuario.correoUsuario}">
                        </option>

                    </select>

                </div>

                <div class="error-message"
                     th:if="${#fields.hasErrors('usuario')}"
                     th:errors="*{usuario}">
                </div>


                <!-- ERROR GENERAL -->
                <div class="error-box"
                     th:if="${error}">

                    <span th:text="${error}"></span>

                </div>


                <!-- BOTÓN -->
                <button type="submit"
                        class="btn-submit">

                    Registrar Docente

                </button>

                <br><br>

                <a class="btn-secondary"
                   th:href="@{/docentes/consultar}">

                    Cancelar

                </a>

            </form>

        </section>

    </main>


    <!-- FOOTER -->
    <footer>

        <div class="footer-links">

            <a th:href="@{/docentes}">
                Inicio
            </a>

            <a th:href="@{/docentes/consultar}">
                Docentes
            </a>

            <a th:href="@{/usuarios}">
                Usuarios
            </a>

        </div>

    </footer>

</body>

</html>
