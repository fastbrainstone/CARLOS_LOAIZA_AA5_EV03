<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Consultar Usuario</title>

    <link rel="stylesheet" th:href="@{/css/estilos.css}">

</head>

<body>

    <nav class="navbar">

        <div class="nav-left">

            <div class="logo">
                Pilosos
            </div>

            <ul class="nav-links">

                <li>
                    <a th:href="@{/usuarios}">
                        Inicio
                    </a>
                </li>

                <li>
                    <a th:href="@{/usuarios/registrar}">
                        Registrar
                    </a>
                </li>

                <li>
                    <a th:href="@{/usuarios/consultar}">
                        Usuarios
                    </a>
                </li>

            </ul>

        </div>

    </nav>


    <main class="crud-container">

        <h1>Consultar usuario por ID</h1>

        <form class="crud-form"
              th:action="@{/usuarios/consultar-id/buscar}"
              method="get">

            <div class="form-group">

                <label for="id">
                    ID del usuario
                </label>

                <input type="number"
                       id="id"
                       name="id"
                       required>

            </div>

            <button type="submit"
                    class="btn-submit">

                Buscar usuario

            </button>

        </form>


        <!-- Mensaje -->
        <div class="message"
             th:if="${mensaje}">

            <span th:text="${mensaje}"></span>

        </div>


        <!-- Resultado -->
        <div class="info-card"
             th:if="${usuario}">

            <h2>Información del usuario</h2>

            <p>
                <strong>ID:</strong>
                <span th:text="${usuario.idUsuario}"></span>
            </p>

            <p>
                <strong>Tipo de identificación:</strong>
                <span th:text="${usuario.tipoId}"></span>
            </p>

            <p>
                <strong>Nombre:</strong>
                <span th:text="${usuario.nombreUsuario}"></span>
            </p>

            <p>
                <strong>Apellido:</strong>
                <span th:text="${usuario.apellidoUsuario}"></span>
            </p>

            <p>
                <strong>Correo:</strong>
                <span th:text="${usuario.correoUsuario}"></span>
            </p>

        </div>

    </main>


    <footer>

        <div class="footer-links">

            <a th:href="@{/usuarios}">
                Inicio
            </a>

            <a th:href="@{/usuarios/consultar}">
                Usuarios
            </a>

        </div>

    </footer>

</body>

</html>
