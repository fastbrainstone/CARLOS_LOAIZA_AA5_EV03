<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Consultar Usuarios</title>

    <link rel="stylesheet" th:href="@{/css/estilos.css}">

</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <div class="nav-left">

            <div class="logo">
                Pilosos
            </div>

            <ul class="nav-links">

                <li>
                    <a th:href="@{/usuarios}">
                        Inicio
                    </a>
                </li>

                <li class="dropdown">

                    <a href="#">
                        Usuarios
                    </a>

                    <div class="dropdown-content">

                        <a th:href="@{/usuarios/registrar}">
                            Registrar
                        </a>

                        <a th:href="@{/usuarios/consultar}">
                            Consultar
                        </a>

                        <a th:href="@{/usuarios/consultar-id}">
                            Consultar por ID
                        </a>

                        <a th:href="@{/usuarios/eliminar}">
                            Eliminar
                        </a>

                    </div>

                </li>

                <li>
                    <a th:href="@{/docentes}">
                        Docentes
                    </a>
                </li>

            </ul>

        </div>

    </nav>


    <!-- Contenido -->
    <main class="crud-container">

        <h1>Usuarios registrados</h1>

        <a class="btn-primary"
           th:href="@{/usuarios/registrar}">

            + Registrar usuario

        </a>

        <br><br>


        <div class="table-container">

            <table class="crud-table">

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Tipo ID</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Correo</th>
                        <th>Acciones</th>

                    </tr>

                </thead>

                <tbody>

                    <tr th:each="usuario : ${usuarios}">

                        <td th:text="${usuario.idUsuario}">
                            ID
                        </td>

                        <td th:text="${usuario.tipoId}">
                            Tipo ID
                        </td>

                        <td th:text="${usuario.nombreUsuario}">
                            Nombre
                        </td>

                        <td th:text="${usuario.apellidoUsuario}">
                            Apellido
                        </td>

                        <td th:text="${usuario.correoUsuario}">
                            Correo
                        </td>

                        <td>

                            <div class="action-buttons">

                                <a class="btn-edit"
                                   th:href="@{/usuarios/editar/{id}(id=${usuario.idUsuario})}">

                                    Editar

                                </a>

                                <a class="btn-delete"
                                   th:href="@{/usuarios/eliminar}">

                                    Eliminar

                                </a>

                            </div>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </main>


    <footer>

        <div class="footer-links">

            <a th:href="@{/usuarios}">
                Inicio
            </a>

            <a th:href="@{/usuarios/registrar}">
                Registrar
            </a>

            <a th:href="@{/docentes}">
                Docentes
            </a>

        </div>

    </footer>

</body>

</html>
