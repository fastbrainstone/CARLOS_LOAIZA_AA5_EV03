<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Confirmar eliminación</title>

    <link rel="stylesheet" th:href="@{/css/estilos.css}">

</head>

<body>

    <nav class="navbar">

        <div class="nav-left">

            <div class="logo">
                Pilosos
            </div>

            <ul class="nav-links">

                <li>
                    <a th:href="@{/usuarios}">
                        Inicio
                    </a>
                </li>

                <li>
                    <a th:href="@{/usuarios/consultar}">
                        Usuarios
                    </a>
                </li>

            </ul>

        </div>

    </nav>


    <main class="crud-container">

        <div class="confirmation-card">

            <h2>Confirmar eliminación</h2>

            <p>
                ¿Está seguro de que desea eliminar este usuario?
            </p>

            <br>

            <p>
                <strong>ID:</strong>
                <span th:text="${usuario.idUsuario}"></span>
            </p>

            <p>
                <strong>Tipo de identificación:</strong>
                <span th:text="${usuario.tipoId}"></span>
            </p>

            <p>
                <strong>Nombre:</strong>
                <span th:text="${usuario.nombreUsuario}"></span>
            </p>

            <p>
                <strong>Apellido:</strong>
                <span th:text="${usuario.apellidoUsuario}"></span>
            </p>

            <p>
                <strong>Correo:</strong>
                <span th:text="${usuario.correoUsuario}"></span>
            </p>

            <br>


            <form th:action="@{/usuarios/eliminar/confirmar}"
                  method="post">

                <input type="hidden"
                       name="idUsuario"
                       th:value="${usuario.idUsuario}">

                <button type="submit"
                        class="btn-delete">

                    Confirmar eliminación

                </button>

                <a class="btn-secondary"
                   th:href="@{/usuarios/consultar}">

                    Cancelar

                </a>

            </form>


            <!-- Error por relaciones -->
            <div class="error-box"
                 th:if="${mensaje}">

                <span th:text="${mensaje}"></span>

            </div>

        </div>

    </main>


    <footer>

        <div class="footer-links">

            <a th:href="@{/usuarios}">
                Inicio
            </a>

            <a th:href="@{/usuarios/consultar}">
                Usuarios
            </a>

        </div>

    </footer>

</body>

</html>
