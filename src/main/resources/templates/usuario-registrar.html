<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrar Usuario</title>

    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

    <!-- Barra de navegación -->
    <nav class="navbar">

        <div class="nav-left">

            <div class="logo">
                Pilosos
            </div>

            <ul class="nav-links">

                <li>
                    <a th:href="@{/usuarios}">
                        Inicio
                    </a>
                </li>

                <li class="dropdown">

                    <a href="#">
                        Usuarios
                    </a>

                    <div class="dropdown-content">

                        <a th:href="@{/usuarios/registrar}">
                            Registrar
                        </a>

                        <a th:href="@{/usuarios/consultar}">
                            Consultar
                        </a>

                        <a th:href="@{/usuarios/consultar-id}">
                            Consultar por ID
                        </a>

                        <a th:href="@{/usuarios/eliminar}">
                            Eliminar
                        </a>

                    </div>

                </li>

                <li>
                    <a th:href="@{/docentes}">
                        Docentes
                    </a>
                </li>

            </ul>

        </div>

    </nav>


    <!-- Contenido -->
    <main class="container">

        <section class="form-section">

            <form class="register-form"
                  th:action="@{/usuarios/guardar}"
                  th:object="${usuario}"
                  method="post">

                <h3>Registrar Usuario</h3>


                <!-- Tipo de identificación -->
                <div class="input-group">

                    <i>🪪</i>

                    <input type="text"
                           th:field="*{tipoId}"
                           placeholder="Tipo de identificación"
                           maxlength="15">

                </div>

                <div class="error-message"
                     th:if="${#fields.hasErrors('tipoId')}"
                     th:errors="*{tipoId}">
                </div>


                <!-- Nombre -->
                <div class="input-group">

                    <i>👤</i>

                    <input type="text"
                           th:field="*{nombreUsuario}"
                           placeholder="Nombre"
                           maxlength="30">

                </div>

                <div class="error-message"
                     th:if="${#fields.hasErrors('nombreUsuario')}"
                     th:errors="*{nombreUsuario}">
                </div>


                <!-- Apellido -->
                <div class="input-group">

                    <i>👤</i>

                    <input type="text"
                           th:field="*{apellidoUsuario}"
                           placeholder="Apellido"
                           maxlength="30">

                </div>

                <div class="error-message"
                     th:if="${#fields.hasErrors('apellidoUsuario')}"
                     th:errors="*{apellidoUsuario}">
                </div>


                <!-- Correo -->
                <div class="input-group">

                    <i>✉</i>

                    <input type="email"
                           th:field="*{correoUsuario}"
                           placeholder="Correo electrónico"
                           maxlength="255">

                </div>

                <div class="error-message"
                     th:if="${#fields.hasErrors('correoUsuario')}"
                     th:errors="*{correoUsuario}">
                </div>


                <!-- Error general -->
                <div class="error-box"
                     th:if="${error}">

                    <span th:text="${error}"></span>

                </div>


                <!-- Botón -->
                <button type="submit"
                        class="btn-submit">

                    Registrar Usuario

                </button>

                <br><br>

                <a class="btn-secondary"
                   th:href="@{/usuarios/consultar}">

                    Cancelar

                </a>

            </form>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <div class="footer-links">

            <a th:href="@{/usuarios}">
                Inicio
            </a>

            <a th:href="@{/usuarios/consultar}">
                Usuarios
            </a>

            <a th:href="@{/docentes}">
                Docentes
            </a>

        </div>

    </footer>

</body>

</html>
